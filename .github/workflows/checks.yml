name: Required checks

on:
  workflow_call:
    inputs:
      rust:
        type: boolean
        default: true
      frontend:
        type: boolean
        default: true
      audit:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rust:
    if: inputs.rust
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            smoke: true
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-amd64
            runner: windows-2025
            smoke: true
          - name: windows-arm64
            runner: windows-11-arm
          # Intel macOS runners are slow and scarce; tests run under Rosetta.
          - name: darwin-amd64
            runner: macos-15
            target: x86_64-apple-darwin
          - name: darwin-arm64
            runner: macos-15
            smoke: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      TARGET_ARGS: ${{ matrix.target && format('--target={0}', matrix.target) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          # Runner images preinstall drifting stable toolchains; key on the pinned one instead.
          add-rust-environment-hash-key: false
          key: ${{ matrix.name }}-1.95.0-${{ hashFiles('rust/Cargo.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        if: matrix.name == 'linux-amd64'
        run: cargo fmt --manifest-path=rust/Cargo.toml --all -- --check
      - name: Require Rosetta for x86_64 tests
        if: matrix.target == 'x86_64-apple-darwin'
        timeout-minutes: 5
        run: |
          arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
      - name: Prepare Windows DNS capture SDK
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $sdk = cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- dns-capture-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WINDIVERT_PATH=$sdk" >> $env:GITHUB_ENV
          $sdk >> $env:GITHUB_PATH
      - name: Clippy
        shell: bash
        run: cargo clippy --locked --manifest-path=rust/Cargo.toml --workspace --all-targets $TARGET_ARGS -- -D warnings
      - name: Test
        shell: bash
        run: cargo test --locked --manifest-path=rust/Cargo.toml --workspace $TARGET_ARGS
      - name: Exercise nftables, policy routes, and host interception
        if: matrix.name == 'linux-amd64'
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install --yes iproute2 nftables
          test_binary=$(cargo test --locked --manifest-path=rust/Cargo.toml -p sempre-transparent \
            --test linux_netns --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "linux_netns") | .executable')
          test -x "$test_binary"
          sudo env SEMPRE_NETNS_TEST=1 unshare --net --mount-proc \
            sh -c 'ip link set lo up; exec "$1" --ignored --nocapture' \
            sh "$test_binary"
      - name: Exercise the native service
        if: matrix.smoke && runner.os != 'Windows'
        run: rust/scripts/service_smoke.sh
      - name: Exercise the native Windows service
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: ./rust/scripts/service_smoke.ps1

  frontend:
    if: inputs.frontend
    name: Frontend and site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile
      - run: bun run lint
      - run: bun run tsc
      - run: bun run test
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path installer/install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Build site
        run: bun --cwd=site run build
      - name: Install browser
        working-directory: site
        timeout-minutes: 5
        # Hosted Ubuntu images already ship Chromium's system libraries; skip slow apt mirrors.
        run: bunx playwright install chromium
      - name: Verify install commands and private input
        working-directory: site
        run: bun run test:e2e

  vulnerability:
    if: inputs.rust && inputs.audit
    uses: ./.github/workflows/audit.yml

  server-container:
    if: inputs.rust
    name: Multi-user server container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-password
      SEMPRE_PUBLIC_URL: http://127.0.0.1:8787/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the multi-user server
        run: docker compose -p sempre-server-ci -f rust/compose.yml build server
      - name: Pull PostgreSQL image
        timeout-minutes: 5
        shell: bash
        run: |
          delay=10
          for attempt in 1 2 3 4; do
            echo "Pulling PostgreSQL image (attempt $attempt/4)"
            if docker compose -p sempre-server-ci -f rust/compose.yml pull postgres; then
              break
            else
              status=$?
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "PostgreSQL image pull failed after 4 attempts" >&2
              exit "$status"
            fi
            echo "PostgreSQL image pull failed; retrying in $delay seconds" >&2
            sleep "$delay"
            delay=$((delay * 2))
          done
      - name: Start PostgreSQL and initialize the Toolbox schema
        run: |
          docker compose -p sempre-server-ci -f rust/compose.yml up --detach --wait --pull never postgres
          docker compose -p sempre-server-ci -f rust/compose.yml run --rm --no-deps server migrate
      - name: Start the multi-user server
        run: docker compose -p sempre-server-ci -f rust/compose.yml up --detach --wait server
      - name: Verify publishing keeps the last successful artifact
        run: SEMPRE_SERVER_URL=http://127.0.0.1:8787 sh rust/scripts/server_smoke.sh
      - name: Verify the server does not run a proxy core
        run: |
          docker top sempre-server-ci-server-1 | tee /tmp/sempre-server-processes
          test "$(grep -c sempre-server /tmp/sempre-server-processes)" -eq 1
          ! grep -E 'sing-box|mihomo|xray|v2ray|clash-rs|dae' /tmp/sempre-server-processes
      - name: Show service logs
        if: failure()
        run: docker compose -p sempre-server-ci -f rust/compose.yml logs

  result:
    name: Required checks result
    if: always()
    needs: [rust, frontend, vulnerability, server-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce selected checks and record full validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECK_RUST: ${{ inputs.rust }}
          CHECK_FRONTEND: ${{ inputs.frontend }}
          CHECK_AUDIT: ${{ inputs.audit }}
        run: python3 .github/scripts/check-results.py
      - name: Store complete validation evidence
        if: inputs.rust && inputs.frontend && inputs.audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/complete-ci.json
          retention-days: 30
