name: Required checks

on:
  workflow_call:
    inputs:
      rust:
        type: boolean
        default: true
      frontend:
        type: boolean
        default: true
      audit:
        type: boolean
        default: true
      site:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rust:
    if: inputs.rust
    name: Rust (${{ matrix.name }})
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-amd64
            runner: windows-2025
          - name: windows-arm64
            runner: windows-11-arm
          - name: darwin-amd64
            runner: macos-15-intel
          - name: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Prepare Windows DNS capture SDK
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $sdk = cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- dns-capture-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WINDIVERT_PATH=$sdk" >> $env:GITHUB_ENV
          $sdk >> $env:GITHUB_PATH
      - run: cargo test --locked --manifest-path=rust/Cargo.toml --workspace
      - run: cargo clippy --locked --manifest-path=rust/Cargo.toml --workspace --all-targets -- -D warnings

  frontend:
    if: inputs.frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile
      - run: bun run lint
      - run: bun run tsc
      - run: bun run test

  transparent-netns:
    if: inputs.rust
    name: Linux transparent network namespace
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install kernel networking tools
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --yes iproute2 nftables
      - name: Build isolated TProxy integration test
        run: cargo test --locked --manifest-path=rust/Cargo.toml -p sempre-transparent --test linux_netns --no-run
      - name: Exercise nftables, policy routes, and host interception
        shell: bash
        run: |
          test_binary=$(find rust/target/debug/deps -maxdepth 1 -type f \
            -name 'linux_netns-*' -perm -111 -print -quit)
          test -n "$test_binary"
          sudo env SEMPRE_NETNS_TEST=1 unshare --net --mount-proc \
            sh -c 'ip link set lo up; exec "$1" --ignored --nocapture' \
            sh "$PWD/$test_binary"

  vulnerability:
    if: inputs.rust && inputs.audit
    uses: ./.github/workflows/audit.yml

  server-container:
    if: inputs.rust
    name: Multi-user server container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-password
      SEMPRE_PUBLIC_URL: http://127.0.0.1:8787/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the multi-user server
        run: docker compose -p sempre-server-ci -f rust/compose.yml build server
      - name: Start PostgreSQL and initialize the Toolbox schema
        run: |
          docker compose -p sempre-server-ci -f rust/compose.yml up --detach --wait postgres
          docker compose -p sempre-server-ci -f rust/compose.yml run --rm --no-deps server migrate
      - name: Start the multi-user server
        run: docker compose -p sempre-server-ci -f rust/compose.yml up --detach --wait server
      - name: Verify publishing keeps the last successful artifact
        run: SEMPRE_SERVER_URL=http://127.0.0.1:8787 sh rust/scripts/server_smoke.sh
      - name: Verify the server does not run a proxy core
        run: |
          docker top sempre-server-ci-server-1 | tee /tmp/sempre-server-processes
          test "$(grep -c sempre-server /tmp/sempre-server-processes)" -eq 1
          ! grep -E 'sing-box|mihomo|xray|v2ray|clash-rs|dae' /tmp/sempre-server-processes
      - name: Show service logs
        if: always()
        run: docker compose -p sempre-server-ci -f rust/compose.yml logs
      - name: Stop the isolated stack
        if: always()
        run: docker compose -p sempre-server-ci -f rust/compose.yml down --volumes

  format:
    if: inputs.rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path=rust/Cargo.toml --all -- --check

  service:
    if: inputs.rust
    uses: ./.github/workflows/service-smoke.yml

  site:
    if: inputs.site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd site --frozen-lockfile
      - name: Validate installers
        if: ${{ !inputs.frontend }}
        run: |
          shellcheck installer/install.sh installer/install_test.sh
          sh installer/install_test.sh
      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path installer/install.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Lint site
        if: ${{ !inputs.frontend }}
        run: bun --cwd=site run lint
      - name: Build site
        run: bun --cwd=site run build
      - name: Install browser
        working-directory: site
        run: bunx playwright install --with-deps chromium
      - name: Verify install commands and private input
        working-directory: site
        run: bun run test:e2e

  result:
    name: Required checks result
    if: always()
    needs: [rust, frontend, transparent-netns, vulnerability, server-container, format, service, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce selected checks and record full validation
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECK_RUST: ${{ inputs.rust }}
          CHECK_FRONTEND: ${{ inputs.frontend }}
          CHECK_SITE: ${{ inputs.site }}
          CHECK_AUDIT: ${{ inputs.audit }}
        run: python3 .github/scripts/check-results.py
      - name: Store complete validation evidence
        if: inputs.rust && inputs.frontend && inputs.site && inputs.audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/complete-ci.json
          retention-days: 30
