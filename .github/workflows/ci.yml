name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-amd64
            runner: windows-2025
          - name: windows-arm64
            runner: windows-11-arm
          - name: darwin-amd64
            runner: macos-15-intel
          - name: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path=rust/Cargo.toml --all -- --check
      - name: Prepare Windows DNS capture SDK
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $sdk = cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- dns-capture-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WINDIVERT_PATH=$sdk" >> $env:GITHUB_ENV
          $sdk >> $env:GITHUB_PATH
      - run: cargo test --manifest-path=rust/Cargo.toml --workspace
      - run: cargo clippy --manifest-path=rust/Cargo.toml --workspace --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd ui --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile
      - run: bun run lint
      - run: bun run tsc
      - run: bun run test

  transparent-netns:
    name: Linux transparent network namespace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - name: Install kernel networking tools
        run: sudo apt-get update && sudo apt-get install --yes iproute2 nftables
      - name: Build isolated TProxy integration test
        run: cargo test --manifest-path=rust/Cargo.toml -p sempre-transparent --test linux_netns --no-run
      - name: Exercise nftables, policy routes, and host interception
        shell: bash
        run: |
          test_binary=$(find rust/target/debug/deps -maxdepth 1 -type f \
            -name 'linux_netns-*' -perm -111 -print -quit)
          test -n "$test_binary"
          sudo env SEMPRE_NETNS_TEST=1 unshare --net --mount-proc \
            sh -c 'ip link set lo up; exec "$1" --ignored --nocapture' \
            sh "$PWD/$test_binary"

  vulnerability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - run: cargo install cargo-audit --locked
      - name: Verify ignored RSA advisory is unreachable
        run: test -z "$(cargo tree --manifest-path=rust/Cargo.toml --workspace --target all -i rsa 2>/dev/null)"
      # rsa is locked only through SQLx's disabled MySQL feature, is absent from
      # every target's dependency graph, and RUSTSEC-2023-0071 has no fixed release.
      - run: cargo audit --file rust/Cargo.lock --ignore RUSTSEC-2023-0071

  server-container:
    name: Multi-user server container
    runs-on: ubuntu-24.04
    env:
      POSTGRES_PASSWORD: ci-password
      SEMPRE_PUBLIC_URL: http://127.0.0.1:8787/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and start the multi-user server
        run: docker compose -p sempre-server-ci -f rust/compose.yml up --build --detach --wait
      - name: Verify publishing keeps the last successful artifact
        run: sh rust/scripts/server_smoke.sh
      - name: Verify the server does not run a proxy core
        run: |
          docker top sempre-server-ci-server-1 | tee /tmp/sempre-server-processes
          test "$(grep -c sempre-server /tmp/sempre-server-processes)" -eq 1
          ! grep -E 'sing-box|mihomo|xray|v2ray|clash-rs|dae' /tmp/sempre-server-processes
      - name: Show service logs
        if: always()
        run: docker compose -p sempre-server-ci -f rust/compose.yml logs
      - name: Stop the isolated stack
        if: always()
        run: docker compose -p sempre-server-ci -f rust/compose.yml down --volumes

  build:
    name: Build (${{ matrix.name }})
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: windows-amd64
            runner: windows-2025
          - name: windows-arm64
            runner: windows-11-arm
          - name: darwin-amd64
            runner: macos-15-intel
          - name: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd ui --frozen-lockfile
      - run: cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sempre-dist-${{ matrix.name }}
          path: dist/
