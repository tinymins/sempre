name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      frontend: ${{ steps.scope.outputs.frontend }}
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: scope
        run: python3 .github/scripts/ci-scope.py

  checks:
    name: Checks
    needs: scope
    uses: ./.github/workflows/checks.yml
    with:
      rust: ${{ needs.scope.outputs.rust == 'true' }}
      frontend: ${{ needs.scope.outputs.frontend == 'true' }}

  pages:
    needs: [scope, checks]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.checks.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.deploy == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      checked-sha: ${{ github.sha }}
