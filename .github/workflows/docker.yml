name: Docker Hub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (v2.0.20 or v2.0.20-beta.12)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: docker.io/ohmywrt/sempre

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve the release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          tag=${INPUT_TAG:-$GITHUB_REF_NAME}
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "Expected a version tag such as v2.0.20 or v2.0.20-beta.12" >&2
            exit 1
          }
          sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    name: Build and verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      POSTGRES_PASSWORD: ci-password
      SEMPRE_PUBLIC_URL: http://127.0.0.1:8787/
      COMPOSE_PROJECT_NAME: sempre-docker-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sempre:verify
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
          cache-from: type=gha,scope=sempre-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sempre-${{ matrix.arch }}
      - name: Start PostgreSQL and initialize the Toolbox schema
        shell: bash
        run: |
          export COMPOSE_FILE="rust/compose.yml:$RUNNER_TEMP/compose-image.yml"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          printf 'services:\n  server:\n    image: sempre:verify\n' > "$RUNNER_TEMP/compose-image.yml"
          docker compose up --detach --wait postgres
          docker compose run --rm --no-deps --no-build server migrate
      - name: Verify the container
        shell: bash
        run: |
          docker compose up --detach --wait --no-build server
          SEMPRE_SERVER_URL=http://127.0.0.1:8787 sh rust/scripts/server_smoke.sh
          docker top "$(docker compose ps -q server)" | tee "$RUNNER_TEMP/sempre-processes"
          test "$(grep -c sempre-server "$RUNNER_TEMP/sempre-processes")" -eq 1
          ! grep -E 'sing-box|mihomo|xray|v2ray|clash-rs|dae' "$RUNNER_TEMP/sempre-processes"
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop the isolated stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/compose-image.yml" ]; then
            docker compose down --volumes
          fi
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the verified image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release.outputs.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sempre-${{ matrix.arch }}
      - name: Export the image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: docker-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate version and channel tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.tag, '-') }}
            type=raw,value=beta,enable=${{ contains(needs.release.outputs.tag, '-') }}
      - name: Publish the multi-platform manifest
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          printf 'Published %s for linux/amd64 and linux/arm64.\n' "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"
