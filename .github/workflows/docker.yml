name: Docker images

on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

# Serialize channel writes across tags without serializing image builds.
concurrency:
  group: docker-${{ inputs.phase }}-${{ inputs.phase == 'publish' && 'channels' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.phase == 'build'
    name: Build and verify (${{ matrix.image }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [sempre, sempre-proxy]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: sempre
            dockerfile: rust/Dockerfile
          - image: sempre-proxy
            dockerfile: rust/proxy.Dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE: docker.io/ohmywrt/${{ matrix.image }}
      POSTGRES_PASSWORD: ci-password
      SEMPRE_PUBLIC_URL: http://127.0.0.1:8787/
      COMPOSE_PROJECT_NAME: sempre-docker-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install OCI image transport
        timeout-minutes: 5
        run: command -v skopeo || (sudo apt-get update && sudo apt-get install --yes skopeo)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=min
          tags: ${{ matrix.image }}:verify
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Load the exact OCI image for runtime verification
        env:
          ARCH: ${{ matrix.arch }}
          LOCAL_IMAGE: ${{ matrix.image }}:verify
        run: skopeo copy --override-os linux --override-arch "$ARCH" "oci-archive:$RUNNER_TEMP/image.tar" "docker-daemon:$LOCAL_IMAGE"
      - name: Start PostgreSQL and initialize the Toolbox schema
        if: matrix.image == 'sempre'
        shell: bash
        run: |
          export COMPOSE_FILE="rust/compose.yml:$RUNNER_TEMP/compose-image.yml"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          printf 'services:\n  server:\n    image: sempre:verify\n' > "$RUNNER_TEMP/compose-image.yml"
          docker compose up --detach --wait postgres
          docker compose run --rm --no-deps server migrate
      - name: Verify the container
        if: matrix.image == 'sempre'
        shell: bash
        run: |
          docker compose up --detach --wait --no-build server
          SEMPRE_SERVER_URL=http://127.0.0.1:8787 sh rust/scripts/server_smoke.sh
          docker top "$(docker compose ps -q server)" | tee "$RUNNER_TEMP/sempre-processes"
          test "$(grep -c sempre-server "$RUNNER_TEMP/sempre-processes")" -eq 1
          ! grep -E 'sing-box|mihomo|xray|v2ray|clash-rs|dae' "$RUNNER_TEMP/sempre-processes"
      - name: Show service logs
        if: failure() && matrix.image == 'sempre'
        run: docker compose logs
      - name: Stop the isolated stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/compose-image.yml" ]; then
            docker compose down --volumes
          fi
      - name: Store the verified OCI image and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image-${{ matrix.image }}_${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 7
          overwrite: true

  upload:
    if: inputs.phase == 'publish'
    name: Upload verified image (${{ matrix.image }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [sempre, sempre-proxy]
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: docker.io/ohmywrt/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: docker-image-${{ matrix.image }}_${{ matrix.arch }}
          path: ${{ runner.temp }}/verified-image
      - name: Install OCI image transport
        timeout-minutes: 5
        run: command -v skopeo || (sudo apt-get update && sudo apt-get install --yes skopeo)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the verified archive by its original digest
        shell: bash
        run: |
          archive="oci-archive:$RUNNER_TEMP/verified-image/image.tar"
          skopeo inspect --raw "$archive" > "$RUNNER_TEMP/manifest.json"
          digest=$(skopeo manifest-digest "$RUNNER_TEMP/manifest.json")
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json"             "$archive" "docker://$IMAGE@$digest"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.image }}_${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 7
          overwrite: true

  publish:
    strategy:
      fail-fast: false
      matrix:
        image: [sempre, sempre-proxy]
    env:
      IMAGE: docker.io/ohmywrt/${{ matrix.image }}
    if: inputs.phase == 'publish'
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: docker-digest-${{ matrix.image }}_*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate version and channel tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
      - name: Publish the multi-platform manifest
        env:
          METADATA: ${{ steps.meta.outputs.json }}
        shell: bash
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          printf 'Published %s for linux/amd64 and linux/arm64.\n' "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"
