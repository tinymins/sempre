name: Mihomo adapter smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIHOMO_VERSION: 1.19.29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - name: Build Rust client
        shell: bash
        run: |
          mkdir smoke
          cargo build --locked --manifest-path=rust/Cargo.toml -p sempre-client
          cp rust/target/debug/sempre smoke/sempre
      - name: Exercise Mihomo through the Rust daemon
        run: bash rust/scripts/mihomo_smoke.sh
