name: Mihomo adapter smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: mihomo-adapter-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIHOMO_VERSION: 1.19.29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.13
          cache: true
      - name: Build Sempre
        shell: bash
        run: |
          mkdir smoke
          go build -o smoke/sempre ./cmd/sempre
      - name: Install and validate Mihomo
        shell: bash
        run: |
          cat > smoke/subscription.yaml <<'EOF'
          proxies:
            - name: smoke
              type: ss
              server: 127.0.0.1
              port: 443
              cipher: aes-128-gcm
              password: smoke-test
          EOF
          sudo ./smoke/sempre --portable core install "mihomo@${MIHOMO_VERSION}"
          sudo ./smoke/sempre --portable core use "mihomo@${MIHOMO_VERSION}"
          sudo ./smoke/sempre --portable config import smoke/subscription.yaml
          sudo ./smoke/sempre --portable doctor
      - name: Exercise Mihomo control API
        shell: bash
        run: |
          # The runner intentionally owns the log file; only Sempre needs elevation.
          # shellcheck disable=SC2024
          sudo ./smoke/sempre --portable portable run > smoke/portable.log 2>&1 &
          sempre_pid=$!
          cleanup() {
            sudo kill "$sempre_pid" 2>/dev/null || true
            wait "$sempre_pid" 2>/dev/null || true
            cat smoke/portable.log
          }
          trap cleanup EXIT

          control=''
          for ((attempt = 0; attempt < 150; attempt++)); do
            if sudo test -f smoke/.sempre/run/control.json; then
              control=$(sudo cat smoke/.sempre/run/control.json)
              base_url=$(jq -r '.BaseURL // empty' <<<"$control")
              secret=$(jq -r '.Secret // empty' <<<"$control")
              core=$(jq -r '.Core // empty' <<<"$control")
              if [[ "$core" == 'mihomo' && -n "$base_url" && -n "$secret" ]] &&
                curl --fail --silent --max-time 2 -H "Authorization: Bearer $secret" "$base_url/version" > smoke/version.json; then
                break
              fi
            fi
            sleep 0.2
          done

          test "${core:-}" = 'mihomo'
          jq -e --arg version "$MIHOMO_VERSION" '.version | contains($version)' smoke/version.json
          curl --fail --silent -H "Authorization: Bearer $secret" "$base_url/proxies" | jq -e '.proxies | type == "object"'
          curl --fail --silent -H "Authorization: Bearer $secret" "$base_url/connections" | jq -e '.connections | type == "array"'
          curl --fail --silent -H "Authorization: Bearer $secret" "$base_url/rules" | jq -e '.rules | type == "array"'
