name: Prewarm Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to prebuild, for example v2.0.8-beta.6
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-prewarm
  cancel-in-progress: true

jobs:
  prewarm:
    name: Prewarm (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd ui --frozen-lockfile
      - name: Restore Windows release target
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/target/debug
            rust/target/${{ matrix.target }}/release
          key: windows-release-v2-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}-${{ inputs.version }}
          restore-keys: |
            windows-release-v2-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock') }}-
            windows-release-v2-${{ matrix.name }}-
            windows-release-v1-${{ matrix.name }}-${{ hashFiles('rust/Cargo.lock') }}-
            windows-release-v1-${{ matrix.name }}-
      - name: Preserve prewarmed Cargo fingerprints
        shell: pwsh
        run: |
          $timestamp = [DateTime]::Parse('2000-01-01T00:00:00Z').ToUniversalTime()
          git ls-files rust | ForEach-Object {
            if (Test-Path -LiteralPath $_ -PathType Leaf) {
              (Get-Item -LiteralPath $_).LastWriteTimeUtc = $timestamp
            }
          }
      - name: Restore verified release inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/sempre-artifacts/${{ matrix.name }}
          key: release-inputs-v1-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            release-inputs-v1-${{ matrix.name }}-
      - name: Build native release
        run: >-
          cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- package
          --version "${{ inputs.version }}"
          --target "${{ matrix.name }}"
          --artifact-cache ".cache/sempre-artifacts/${{ matrix.name }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Cache cargo-cyclonedx
        id: cargo-cyclonedx-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-cyclonedx*
          key: cargo-cyclonedx-0.5.9-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-cyclonedx
        if: steps.cargo-cyclonedx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
