name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - name: Validate stable release notes
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          notes_path=".github/release-notes/$GITHUB_REF_NAME.md"
          test -s "$notes_path" || {
            echo "Stable release notes are required at $notes_path" >&2
            exit 1
          }
          awk '
            /^## 简体中文$/ { section = "zh"; next }
            /^## English$/ { section = "en"; next }
            /^## / { section = "" }
            section == "zh" && /^- / { zh = 1 }
            section == "en" && /^- / { en = 1 }
            END { exit !(zh && en) }
          ' "$notes_path" || {
            echo "Stable release notes must contain non-empty ## 简体中文 and ## English sections" >&2
            exit 1
          }
      - id: ci
        name: Resolve complete CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/resolve-ci.py

  checks:
    needs: verify
    if: needs.verify.outputs.reuse != 'true'
    uses: ./.github/workflows/checks.yml
    with:
      audit: false

  audit:
    uses: ./.github/workflows/audit.yml

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: sempre-linux-amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: sempre-linux-arm64
          - name: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: sempre-windows-amd64.exe
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: sempre-windows-arm64.exe
          - name: darwin-amd64
            runner: macos-15
            target: x86_64-apple-darwin
            binary: sempre-darwin-amd64
          - name: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: sempre-darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build native release
        run: >-
          cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- package
          --version "${{ github.ref_name }}"
          --target "${{ matrix.name }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          cargo cyclonedx \
            --manifest-path rust/crates/sempre-client/Cargo.toml \
            --format json \
            --describe binaries \
            --target "${{ matrix.target }}"
          mv rust/crates/sempre-client/sempre_bin.cdx.json \
            "dist/${{ matrix.binary }}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/${{ matrix.binary }}
            dist/sempre-bundle-*
            dist/sempre-ui.zip
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ matrix.binary }}
          sbom-path: dist/${{ matrix.binary }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sempre-release-${{ matrix.name }}
          path: dist/

  docker:
    name: Build and verify (${{ matrix.image }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        image: [sempre, sempre-proxy]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: sempre
            dockerfile: rust/Dockerfile
          - image: sempre-proxy
            dockerfile: rust/proxy.Dockerfile
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE: docker.io/ohmywrt/${{ matrix.image }}
      POSTGRES_PASSWORD: ci-password
      SEMPRE_PUBLIC_URL: http://127.0.0.1:8787/
      COMPOSE_PROJECT_NAME: sempre-docker-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install OCI image transport
        timeout-minutes: 5
        run: command -v skopeo || (sudo apt-get update && sudo apt-get install --yes skopeo)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=min
          tags: ${{ matrix.image }}:verify
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Load the exact OCI image for runtime verification
        env:
          ARCH: ${{ matrix.arch }}
          LOCAL_IMAGE: ${{ matrix.image }}:verify
        run: skopeo copy --override-os linux --override-arch "$ARCH" "oci-archive:$RUNNER_TEMP/image.tar" "docker-daemon:$LOCAL_IMAGE"
      - name: Start PostgreSQL and initialize the Toolbox schema
        if: matrix.image == 'sempre'
        shell: bash
        run: |
          export COMPOSE_FILE="rust/compose.yml:$RUNNER_TEMP/compose-image.yml"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          printf 'services:\n  server:\n    image: sempre:verify\n' > "$RUNNER_TEMP/compose-image.yml"
          docker compose up --detach --wait postgres
          docker compose run --rm --no-deps server migrate
      - name: Verify the container
        if: matrix.image == 'sempre'
        shell: bash
        run: |
          docker compose up --detach --wait --no-build server
          SEMPRE_SERVER_URL=http://127.0.0.1:8787 sh rust/scripts/server_smoke.sh
          docker top "$(docker compose ps -q server)" | tee "$RUNNER_TEMP/sempre-processes"
          test "$(grep -c sempre-server "$RUNNER_TEMP/sempre-processes")" -eq 1
          ! grep -E 'sing-box|mihomo|xray|v2ray|clash-rs|dae' "$RUNNER_TEMP/sempre-processes"
      - name: Show service logs
        if: failure() && matrix.image == 'sempre'
        run: docker compose logs
      - name: Stop the isolated stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/compose-image.yml" ]; then
            docker compose down --volumes
          fi
      - name: Store the verified OCI image and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image-${{ matrix.image }}_${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          retention-days: 7
          overwrite: true

  gate:
    if: always()
    needs: [verify, checks, audit, build, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require validation and every build before publishing
        env:
          RESULTS: ${{ toJSON(needs) }}
          OPTIONAL: ${{ needs.verify.outputs.reuse == 'true' && 'checks' || '' }}
          TITLE: Release gate
        run: python3 .github/scripts/workflow-summary.py

  publish:
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: sempre-release-*
          path: dist
          merge-multiple: true
      - name: Refresh aggregate checksums
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -name 'sempre-*' ! -name '*.cdx.json' \
            -printf '%f\n' | sort | (cd dist && xargs sha256sum) > dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --generate-notes)
          else
            release_flags+=(--notes-file ".github/release-notes/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            "${release_flags[@]}" \
            --verify-tag

      - name: Installers are available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh release view "$GITHUB_REF_NAME" --json url --jq .url)
          printf '## Installers ready\n\n[Download %s](%s)\n\nDocker and Pages have separate completion states.\n' "$GITHUB_REF_NAME" "$url" >> "$GITHUB_STEP_SUMMARY"

  docker-publish:
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Serialize channel writes across tags.
    concurrency:
      group: docker-channels
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: docker-image-*
          path: ${{ runner.temp }}/images
      - name: Install OCI image transport
        timeout-minutes: 5
        run: command -v skopeo || (sudo apt-get update && sudo apt-get install --yes skopeo)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified archives by digest and update channel tags
        shell: bash
        run: |
          channel=latest
          [[ "$GITHUB_REF_NAME" == *-* ]] && channel=beta
          for image in sempre sempre-proxy; do
            repository="docker.io/ohmywrt/$image"
            sources=()
            for arch in amd64 arm64; do
              archive="oci-archive:$RUNNER_TEMP/images/docker-image-${image}_${arch}/image.tar"
              skopeo inspect --raw "$archive" > "$RUNNER_TEMP/manifest.json"
              digest=$(skopeo manifest-digest "$RUNNER_TEMP/manifest.json")
              skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
                "$archive" "docker://$repository@$digest"
              sources+=("$repository@$digest")
            done
            docker buildx imagetools create \
              --tag "$repository:$GITHUB_REF_NAME" --tag "$repository:$channel" "${sources[@]}"
          done

  pages:
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: publish
    uses: ./.github/workflows/pages.yml
