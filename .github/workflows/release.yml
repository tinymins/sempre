name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd ui --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile
      - run: cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- verify

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: sempre-linux-amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: sempre-linux-arm64
          - name: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: sempre-windows-amd64.exe
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: sempre-windows-arm64.exe
          - name: darwin-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: sempre-darwin-amd64
          - name: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: sempre-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd ui --frozen-lockfile
      - name: Build native release
        run: cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- package --version "${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx \
            --manifest-path rust/crates/sempre-client/Cargo.toml \
            --format json \
            --describe binaries \
            --target "${{ matrix.target }}"
          mv rust/crates/sempre-client/sempre_bin.cdx.json \
            "dist/${{ matrix.binary }}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/${{ matrix.binary }}
            dist/sempre-bundle-*.zip
            dist/sempre-ui.zip
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ matrix.binary }}
          sbom-path: dist/${{ matrix.binary }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sempre-release-${{ matrix.name }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: sempre-release-*
          path: dist
          merge-multiple: true
      - name: Refresh aggregate checksums
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -name 'sempre-*' ! -name '*.cdx.json' \
            -printf '%f\n' | sort | (cd dist && xargs sha256sum) > dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            "${release_flags[@]}" \
            --generate-notes \
            --verify-tag
