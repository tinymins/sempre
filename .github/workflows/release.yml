name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.12
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd ui --frozen-lockfile
      - run: go run ./cmd/build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/sempre-windows-amd64.exe
            dist/sempre-windows-arm64.exe
            dist/sempre-linux-amd64
            dist/sempre-linux-arm64
            dist/sempre-darwin-amd64
            dist/sempre-darwin-arm64
            dist/sempre-ui.zip
            dist/sempre-bundle-*.zip
      - name: Generate target SBOMs
        shell: bash
        run: |
          GOBIN="$RUNNER_TEMP" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          generate_sbom() {
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 "$RUNNER_TEMP/cyclonedx-gomod" \
              app -json -notimestamp -packages -licenses \
              -main cmd/sempre -output "dist/$3.cdx.json" .
          }
          generate_sbom windows amd64 sempre-windows-amd64.exe
          generate_sbom windows arm64 sempre-windows-arm64.exe
          generate_sbom linux amd64 sempre-linux-amd64
          generate_sbom linux arm64 sempre-linux-arm64
          generate_sbom darwin amd64 sempre-darwin-amd64
          generate_sbom darwin arm64 sempre-darwin-arm64
      - name: Attest Windows amd64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/sempre-windows-amd64.exe
          sbom-path: dist/sempre-windows-amd64.exe.cdx.json
      - name: Attest Windows arm64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/sempre-windows-arm64.exe
          sbom-path: dist/sempre-windows-arm64.exe.cdx.json
      - name: Attest Linux amd64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/sempre-linux-amd64
          sbom-path: dist/sempre-linux-amd64.cdx.json
      - name: Attest Linux arm64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/sempre-linux-arm64
          sbom-path: dist/sempre-linux-arm64.cdx.json
      - name: Attest macOS amd64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/sempre-darwin-amd64
          sbom-path: dist/sempre-darwin-amd64.cdx.json
      - name: Attest macOS arm64 SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/sempre-darwin-arm64
          sbom-path: dist/sempre-darwin-arm64.cdx.json
      - name: Refresh release checksums
        shell: bash
        run: (cd dist && find . -maxdepth 1 -type f -name 'sempre-*' ! -name '*.cdx.json' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            --generate-notes \
            --verify-tag
