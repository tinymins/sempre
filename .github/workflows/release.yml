name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release-notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate stable release notes
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        run: |
          notes_path=".github/release-notes/$GITHUB_REF_NAME.md"
          test -s "$notes_path" || {
            echo "Stable release notes are required at $notes_path" >&2
            exit 1
          }
          awk '
            /^## 简体中文$/ { section = "zh"; next }
            /^## English$/ { section = "en"; next }
            /^## / { section = "" }
            section == "zh" && /^- / { zh = 1 }
            section == "en" && /^- / { en = 1 }
            END { exit !(zh && en) }
          ' "$notes_path" || {
            echo "Stable release notes must contain non-empty ## 简体中文 and ## English sections" >&2
            exit 1
          }

  verify:
    needs: release-notes
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd ui --frozen-lockfile
      - run: bun install --cwd site --frozen-lockfile
      - run: cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- verify

  build:
    needs: release-notes
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: sempre-linux-amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: sempre-linux-arm64
          - name: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: sempre-windows-amd64.exe
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: sempre-windows-arm64.exe
          - name: darwin-amd64
            runner: macos-15
            target: x86_64-apple-darwin
            binary: sempre-darwin-amd64
          - name: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: sempre-darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --cwd ui --frozen-lockfile
      - name: Restore verified release inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/sempre-artifacts/${{ matrix.name }}
          key: release-inputs-v1-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            release-inputs-v1-${{ matrix.name }}-
      - name: Build native release
        run: >-
          cargo run --manifest-path=rust/Cargo.toml -p sempre-build -- package
          --version "${{ github.ref_name }}"
          --target "${{ matrix.name }}"
          --artifact-cache ".cache/sempre-artifacts/${{ matrix.name }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Cache cargo-cyclonedx
        id: cargo-cyclonedx-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/cargo-cyclonedx*
          key: cargo-cyclonedx-0.5.9-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-cyclonedx
        if: steps.cargo-cyclonedx-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          cargo cyclonedx \
            --manifest-path rust/crates/sempre-client/Cargo.toml \
            --format json \
            --describe binaries \
            --target "${{ matrix.target }}"
          mv rust/crates/sempre-client/sempre_bin.cdx.json \
            "dist/${{ matrix.binary }}.cdx.json"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/${{ matrix.binary }}
            dist/sempre-bundle-*.zip
            dist/sempre-ui.zip
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ matrix.binary }}
          sbom-path: dist/${{ matrix.binary }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sempre-release-${{ matrix.name }}
          path: dist/

  publish:
    needs: [release-notes, verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: sempre-release-*
          path: dist
          merge-multiple: true
      - name: Refresh aggregate checksums
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -name 'sempre-*' ! -name '*.cdx.json' \
            -printf '%f\n' | sort | (cd dist && xargs sha256sum) > dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --generate-notes)
          else
            release_flags+=(--notes-file ".github/release-notes/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            "${release_flags[@]}" \
            --verify-tag
