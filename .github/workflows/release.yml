name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - run: go run ./cmd/build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/sempre-windows-amd64.exe \
            dist/sempre-windows-arm64.exe \
            dist/sempre-linux-amd64 \
            dist/sempre-linux-arm64 \
            dist/sempre-darwin-amd64 \
            dist/sempre-darwin-arm64 \
            dist/SHA256SUMS \
            --generate-notes \
            --verify-tag
