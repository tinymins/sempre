name: Native Rust service smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  service-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux
          - runner: windows-2025
            name: windows
          - runner: macos-15
            name: macos
    name: Service (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - name: Build Rust smoke release
        shell: bash
        if: runner.os != 'Windows'
        run: |
          cargo build --manifest-path=rust/Cargo.toml \
            -p sempre-client -p sempre-testcore -p sempre-smoke-setup
          mkdir smoke
          cp rust/target/debug/sempre smoke/sempre
          cargo run --manifest-path=rust/Cargo.toml -p sempre-smoke-setup -- \
            --root "$PWD/smoke" --core "$PWD/rust/target/debug/sempre-testcore"
      - name: Exercise native Rust service
        shell: bash
        if: runner.os != 'Windows'
        run: |
          sudo ./smoke/sempre --portable service install --yes
          sudo ./smoke/sempre --portable service install --yes
          ./smoke/sempre service status | grep -q running
          wait_runtime() {
            desired="$1" state="$2" runtime_status=''
            for _ in $(seq 1 100); do
              runtime_status=$(sudo ./smoke/sempre --system runtime status 2>/dev/null || true)
              if printf '%s\n' "$runtime_status" | grep -q "Desired: $desired" && \
                printf '%s\n' "$runtime_status" | grep -q "State: $state"; then
                return 0
              fi
              sleep 0.2
            done
            printf 'managed core did not reach %s/%s:\n%s\n' \
              "$desired" "$state" "$runtime_status" >&2
            return 1
          }
          wait_runtime running running
          sudo ./smoke/sempre --portable service deploy core | grep -q 'core deployment completed'
          wait_runtime running running
          sudo ./smoke/sempre --portable service deploy data | grep -q 'data deployment completed'
          wait_runtime running running
          sudo ./smoke/sempre --system runtime stop >/dev/null
          wait_runtime stopped stopped
          sudo ./smoke/sempre --portable service restart
          wait_runtime stopped stopped
          printf '%s\n' 'trojan://secret@example.com:443#smoke-updated' > smoke/subscription-updated.txt
          sudo ./smoke/sempre --system config import smoke/subscription-updated.txt | grep -q staged
          wait_runtime stopped stopped
          sudo ./smoke/sempre --system runtime start >/dev/null
          wait_runtime running running
          sudo ./smoke/sempre --system runtime restart >/dev/null
          wait_runtime running running
          sudo ./smoke/sempre --portable service stop
          sudo ./smoke/sempre --portable service start
          sudo ./smoke/sempre --portable service restart
          sudo ./smoke/sempre --portable service uninstall
      - name: Build and exercise Windows Rust service
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --manifest-path=rust/Cargo.toml `
            -p sempre-client -p sempre-testcore -p sempre-smoke-setup
          New-Item -ItemType Directory -Path smoke
          Copy-Item rust/target/debug/sempre.exe smoke/sempre.exe
          cargo run --manifest-path=rust/Cargo.toml -p sempre-smoke-setup -- `
            --root "$PWD/smoke" --core "$PWD/rust/target/debug/sempre-testcore.exe"
          ./smoke/sempre.exe --portable service install --yes
          ./smoke/sempre.exe --portable service install --yes
          if ((./smoke/sempre.exe service status | Out-String) -notmatch 'running') {
            throw 'Sempre service is not running'
          }
          function Wait-RuntimeState([string]$Desired, [string]$State) {
            $runtimeStatus = ''
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              try {
                $runtimeStatus = ./smoke/sempre.exe --system runtime status 2>$null | Out-String
                if ($runtimeStatus -match "Desired: $Desired" -and $runtimeStatus -match "State: $State") { return }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            throw "managed core did not reach ${Desired}/${State}: $runtimeStatus"
          }
          Wait-RuntimeState running running
          $coreDeploy = ./smoke/sempre.exe --portable service deploy core | Out-String
          if ($coreDeploy -notmatch 'core deployment completed') { throw "core deployment failed: $coreDeploy" }
          Wait-RuntimeState running running
          $dataDeploy = ./smoke/sempre.exe --portable service deploy data | Out-String
          if ($dataDeploy -notmatch 'data deployment completed') { throw "data deployment failed: $dataDeploy" }
          Wait-RuntimeState running running
          ./smoke/sempre.exe --system runtime stop | Out-Null
          Wait-RuntimeState stopped stopped
          ./smoke/sempre.exe --portable service restart
          Wait-RuntimeState stopped stopped
          Set-Content -Path smoke/subscription-updated.txt -NoNewline -Value 'trojan://secret@example.com:443#smoke-updated'
          $configResult = ./smoke/sempre.exe --system config import smoke/subscription-updated.txt | Out-String
          if ($configResult -notmatch 'staged') { throw "stopped config import was not compiled: $configResult" }
          Wait-RuntimeState stopped stopped
          ./smoke/sempre.exe --system runtime start | Out-Null
          Wait-RuntimeState running running
          ./smoke/sempre.exe --system runtime restart | Out-Null
          Wait-RuntimeState running running
          ./smoke/sempre.exe --portable service stop
          ./smoke/sempre.exe --portable service start
          ./smoke/sempre.exe --portable service restart
          ./smoke/sempre.exe --portable service uninstall
      - name: Clean Linux service data
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl stop sempre.service 2>/dev/null || true
          sudo systemctl disable sempre.service 2>/dev/null || true
          sudo rm -f /etc/systemd/system/sempre.service
          sudo rm -rf /usr/local/libexec/sempre /var/lib/sempre /var/log/sempre /run/sempre
          sudo systemctl daemon-reload || true
      - name: Clean macOS service data
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          sudo launchctl bootout system/io.github.tinymins.sempre 2>/dev/null || true
          sudo rm -f /Library/LaunchDaemons/io.github.tinymins.sempre.plist
          sudo rm -rf "/Library/Application Support/Sempre" "/Library/Logs/Sempre" /var/run/sempre
      - name: Clean Windows service data
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          sc.exe stop sempre 2>$null
          sc.exe delete sempre 2>$null
          Remove-Item -Recurse -Force "$env:ProgramFiles\Sempre" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:ProgramData\Sempre" -ErrorAction SilentlyContinue
          exit 0
