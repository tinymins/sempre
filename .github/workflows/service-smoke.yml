name: Native service smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  service-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.12
          cache: true
      - name: Build smoke deployment
        shell: bash
        if: runner.os != 'Windows'
        run: |
          mkdir smoke
          go build -o smoke/sempre ./cmd/sempre
          go build -o smoke/testcore ./internal/integration/testcore
          go run ./internal/integration/setup -root "$PWD/smoke" -core "$PWD/smoke/testcore"
      - name: Exercise native service
        shell: bash
        if: runner.os != 'Windows'
        run: |
          sudo ./smoke/sempre --portable service install --yes
          sudo ./smoke/sempre --portable service install --yes
          ./smoke/sempre service status
          for ((attempt = 0; attempt < 50; attempt++)); do
            if sudo ./smoke/sempre --system status | grep -q "Supervisor: running"; then
              break
            fi
            sleep 0.2
          done
          sudo ./smoke/sempre --system doctor
          runtime_status=""
          for ((attempt = 0; attempt < 100; attempt++)); do
            if runtime_status=$(sudo ./smoke/sempre --system runtime status 2>/dev/null) && grep -q "State: running" <<<"$runtime_status"; then
              break
            fi
            sleep 0.2
          done
          grep -q "Desired: running" <<<"$runtime_status"
          grep -q "State: running" <<<"$runtime_status"
          sudo ./smoke/sempre --system runtime stop | grep -q "State: stopped"
          sudo ./smoke/sempre --portable service restart
          runtime_status=""
          for ((attempt = 0; attempt < 100; attempt++)); do
            if runtime_status=$(sudo ./smoke/sempre --system runtime status 2>/dev/null) && grep -q "State: stopped" <<<"$runtime_status"; then
              break
            fi
            sleep 0.2
          done
          grep -q "Desired: stopped" <<<"$runtime_status"
          grep -q "State: stopped" <<<"$runtime_status"
          printf '%s\n' '{"log":{"disabled":true},"inbounds":[],"outbounds":[],"revision":2}' > smoke/config-updated.json
          sudo ./smoke/sempre --system config import smoke/config-updated.json | grep -q "next time it starts"
          sudo ./smoke/sempre --system runtime status | grep -q "State: stopped"
          sudo ./smoke/sempre --system runtime start | grep -q "State: running"
          sudo ./smoke/sempre --system runtime restart | grep -q "State: running"
          sudo ./smoke/sempre --portable service stop
          sudo ./smoke/sempre --portable service start
          sudo ./smoke/sempre --portable service restart
          sudo ./smoke/sempre --portable service uninstall
      - name: Build and exercise Windows service
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path smoke
          go build -o smoke/sempre.exe ./cmd/sempre
          go build -o smoke/testcore.exe ./internal/integration/testcore
          go run ./internal/integration/setup -root "$PWD/smoke" -core "$PWD/smoke/testcore.exe"
          ./smoke/sempre.exe --portable service install --yes
          ./smoke/sempre.exe --portable service install --yes
          ./smoke/sempre.exe service status
          for ($attempt = 0; $attempt -lt 50; $attempt++) {
            $status = ./smoke/sempre.exe --system status
            if ($status -match '^Supervisor: running') {
              break
            }
            Start-Sleep -Milliseconds 200
          }
          ./smoke/sempre.exe --system doctor
          $runtimeStatus = ''
          for ($attempt = 0; $attempt -lt 100; $attempt++) {
            try {
              $runtimeStatus = ./smoke/sempre.exe --system runtime status 2>$null | Out-String
              if ($runtimeStatus -match 'State: running') { break }
            } catch {}
            Start-Sleep -Milliseconds 200
          }
          if ($runtimeStatus -notmatch 'Desired: running' -or $runtimeStatus -notmatch 'State: running') { throw "managed core did not reach running: $runtimeStatus" }
          $runtimeStatus = ./smoke/sempre.exe --system runtime stop | Out-String
          if ($runtimeStatus -notmatch 'State: stopped') { throw "managed core did not stop: $runtimeStatus" }
          ./smoke/sempre.exe --portable service restart
          $runtimeStatus = ''
          for ($attempt = 0; $attempt -lt 100; $attempt++) {
            try {
              $runtimeStatus = ./smoke/sempre.exe --system runtime status 2>$null | Out-String
              if ($runtimeStatus -match 'State: stopped') { break }
            } catch {}
            Start-Sleep -Milliseconds 200
          }
          if ($runtimeStatus -notmatch 'Desired: stopped' -or $runtimeStatus -notmatch 'State: stopped') { throw "stopped intent was not preserved: $runtimeStatus" }
          Set-Content -Path smoke/config-updated.json -NoNewline -Value '{"log":{"disabled":true},"inbounds":[],"outbounds":[],"revision":2}'
          $configResult = ./smoke/sempre.exe --system config import smoke/config-updated.json | Out-String
          if ($configResult -notmatch 'next time it starts') { throw "stopped config import did not defer activation: $configResult" }
          $runtimeStatus = ./smoke/sempre.exe --system runtime status | Out-String
          if ($runtimeStatus -notmatch 'State: stopped') { throw "config import started the managed core: $runtimeStatus" }
          $runtimeStatus = ./smoke/sempre.exe --system runtime start | Out-String
          if ($runtimeStatus -notmatch 'State: running') { throw "managed core did not start: $runtimeStatus" }
          $runtimeStatus = ./smoke/sempre.exe --system runtime restart | Out-String
          if ($runtimeStatus -notmatch 'State: running') { throw "managed core did not restart: $runtimeStatus" }
          ./smoke/sempre.exe --portable service stop
          ./smoke/sempre.exe --portable service start
          ./smoke/sempre.exe --portable service restart
          ./smoke/sempre.exe --portable service uninstall
      - name: Clean Linux service data
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl stop sempre.service 2>/dev/null || true
          sudo systemctl disable sempre.service 2>/dev/null || true
          sudo rm -f /etc/systemd/system/sempre.service
          sudo rm -rf /usr/local/libexec/sempre /var/lib/sempre /var/log/sempre /run/sempre
          sudo systemctl daemon-reload || true
      - name: Clean macOS service data
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          sudo launchctl bootout system/io.github.tinymins.sempre 2>/dev/null || true
          sudo rm -f /Library/LaunchDaemons/io.github.tinymins.sempre.plist
          sudo rm -rf "/Library/Application Support/Sempre" "/Library/Logs/Sempre" /var/run/sempre
      - name: Clean Windows service data
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          sc.exe stop sempre 2>$null
          sc.exe delete sempre 2>$null
          Remove-Item -Recurse -Force "$env:ProgramFiles\Sempre" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:ProgramData\Sempre" -ErrorAction SilentlyContinue
          exit 0
