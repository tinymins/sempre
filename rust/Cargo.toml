[workspace]
members = [
    "crates/sempre-artifact",
    "crates/sempre-converter",
    "crates/sempre-converter-cli",
    "crates/sempre-client",
    "crates/sempre-control",
    "crates/sempre-core",
    "crates/sempre-manager",
    "crates/sempre-network",
    "crates/sempre-server",
    "crates/sempre-state",
    "crates/sempre-subscription",
    "crates/sempre-supervisor",
    "crates/sempre-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
base64 = "0.22"
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
flate2 = "1.1.9"
futures-util = "0.3"
humantime = "2"
nix = { version = "0.31", features = ["process", "signal"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
subtle = "2.6"
sysinfo = "0.39"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
