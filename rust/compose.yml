services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sempre
      POSTGRES_USER: sempre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sempre -d sempre"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: rust/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sempre:${POSTGRES_PASSWORD}@postgres:5432/sempre
      SEMPRE_PUBLIC_URL: ${SEMPRE_PUBLIC_URL:?set SEMPRE_PUBLIC_URL}
      SEMPRE_BIND: 0.0.0.0:8787
      SEMPRE_ALLOW_REGISTRATION: ${SEMPRE_ALLOW_REGISTRATION:-true}
      SEMPRE_SESSION_DAYS: ${SEMPRE_SESSION_DAYS:-30}
      RUST_LOG: ${RUST_LOG:-sempre_server=info,tower_http=info}
    ports:
      - "${SEMPRE_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
