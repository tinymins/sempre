[package]
name = "sempre-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust local daemon and CLI for managing external proxy cores"

[[bin]]
name = "sempre"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
sempre-artifact = { path = "../sempre-artifact" }
sempre-bundle = { path = "../sempre-bundle" }
sempre-control = { path = "../sempre-control" }
sempre-converter = { path = "../sempre-converter" }
sempre-core-control = { path = "../sempre-core-control" }
sempre-gateway = { path = "../sempre-gateway" }
sempre-manager = { path = "../sempre-manager" }
sempre-network = { path = "../sempre-network" }
sempre-service = { path = "../sempre-service" }
sempre-state = { path = "../sempre-state" }
sempre-subscription = { path = "../sempre-subscription" }
sempre-tunnel = { path = "../sempre-tunnel" }
sempre-ui = { path = "../sempre-ui" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true

[lints]
workspace = true
