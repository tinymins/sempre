[package]
name = "sempre-transparent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Client-only transparent proxy runtime and Linux host orchestration"

[dependencies]
ipnet.workspace = true
sysinfo.workspace = true
sempre-converter = { path = "../sempre-converter" }
sempre-network = { path = "../sempre-network" }
sempre-state = { path = "../sempre-state" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["socket", "net"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
socket2.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
