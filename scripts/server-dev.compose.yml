services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toolbox
      POSTGRES_USER: sempre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sempre -d toolbox"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
    name: sempre-toolbox-dev-postgres-data
